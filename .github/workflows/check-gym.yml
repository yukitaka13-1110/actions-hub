# このリポジトリではなく、公開の actions-hub に置くワークフロー。
# actions-hub は public なので Actions の実行が無料で、15 分ジョブを回し続けても課金されない。
#
# 起動は外部の cron サービス（cron-job.org など）から repository_dispatch で行う。
# GitHub 内蔵の cron は最短 5 分かつ数分から十数分ずれるため、監視に空白ができる。
# 外部 cron なら 15 分ちょうどに発火し、ループが途切れない。
#
#   POST https://api.github.com/repos/<owner>/actions-hub/dispatches
#   Authorization: Bearer <actions-hub への contents:write を持つ PAT>
#   Accept: application/vnd.github+json
#   Body: {"event_type": "gym-check"}
#
# 24 時間動かす。止めたい時間帯ができたら cron サービス側のスケジュールで外せる。
#
# AWS へは OIDC で入る。actions-hub は public なので、長期のアクセスキーを Secrets に
# 置きたくない。OIDC なら鍵そのものが存在せず、実行のたびに GitHub が署名した短命の
# トークンを STS に渡して 1 時間だけの資格情報を得る。ロール側は
# repo:<owner>/actions-hub:ref:refs/heads/main からの実行だけを信頼している。
# ロールとテーブルは gym-reservation-checker-v2 の terraform/ が作る。
#
# actions-hub 側に用意するもの:
#   Secrets   GYM_CHECKER_REPO_TOKEN         チェッカー本体への contents:read だけを持つ PAT
#             GYM_CHECKER_LINE_CHANNEL_ACCESS_TOKEN  LINE Messaging API のチャネルアクセストークン

name: "Check 中央体育館"

on:
  repository_dispatch:
    types: [gym-check]
  workflow_dispatch:
    inputs:
      duration:
        description: 監視を続ける時間
        default: 14m
      interval:
        description: 取得の間隔
        default: 25s

concurrency:
  # 発火が重なってもループを二重に回さない。
  group: check-gym
  cancel-in-progress: false

permissions:
  id-token: write # OIDC で AWS のロールを引くため
  contents: read

env:
  AWS_REGION: ap-northeast-1
  AWS_ROLE: arn:aws:iam::307452276908:role/gym-checker-actions-prod
  GYM_CHECKER_TABLE: gym-availability-prod

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout gym-reservation-checker-v2
        uses: actions/checkout@v4
        with:
          repository: yukitaka13-1110/gym-reservation-checker-v2
          ref: main
          token: ${{ secrets.GYM_CHECKER_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run check
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.GYM_CHECKER_LINE_CHANNEL_ACCESS_TOKEN }}
          # 15 分間隔の発火に対して 14 分。checkout と pip の分の余裕を残し、
          # 次の発火と重ならないようにする。cron 側の client_payload で上書きできる。
          # inputs コンテキストは workflow_dispatch でしか使えないため github.event 経由で読む。
          DURATION: ${{ github.event.client_payload.duration || github.event.inputs.duration || '14m' }}
          # 9 館まとめて見ると 1 周が実測 21 秒かかる。20 秒にすると休止がゼロになる。
          INTERVAL: ${{ github.event.client_payload.interval || github.event.inputs.interval || '25s' }}
        run: |
          gym-checker \
            --duration "$DURATION" \
            --interval "$INTERVAL" \
            --table "$GYM_CHECKER_TABLE"
